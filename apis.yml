name: Machinations
description: >-
  Machinations is a visual platform for designing, simulating, and balancing
  game economies, tokenomics, and other complex systems. Studios and designers
  model resource flows as interactive node-and-connection diagrams, run
  Monte-Carlo simulations to predict outcomes, and balance economies before a
  single line of production code is written. The product spans Design, Predict,
  and Balance modules plus an AI Builder that generates runnable diagrams from
  natural-language descriptions and a spreadsheet integration. It is used by
  studios such as Amazon Games, Hasbro, and Zynga and taught at MIT, NYU, and
  Berkeley. Machinations is a Seedcamp portfolio company; at the time of this
  enrichment pass it publishes no public developer API, SDK, or webhook surface.
